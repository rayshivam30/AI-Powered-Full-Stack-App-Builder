spring:
  application:
    name: lovable-clone
    description: this is application

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9010/pgvector-test}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: cohere/north-mini-code:free
          temperature: 0.0


jwt:
  secret-key: ${JWT_SECRET_KEY:}

stripe:
  api:
    secret: ${STRIPE_API_SECRET:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}

client:
  url: ${CLIENT_URL:http://localhost:5173}

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

preview:
  docker:
    command: ${DOCKER_COMMAND:docker}
    host: ${PREVIEW_HOST:127.0.0.1}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  project-bucket: ${MINIO_PROJECT_BUCKET:projects}
